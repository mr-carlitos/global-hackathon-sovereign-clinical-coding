name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check design contracts and documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/check_repo.py 2>&1 | tee artifacts/contracts.log
      - name: Test foundation validators
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/tests.log
      - name: Upload synthetic-only check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
